<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Quest · A2</title><style>:root{--ink:#27314c;--purple:#7759d9;--soft:#f6f2ff;--pink:#ffe9ef;--mint:#e3f8ed}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#f8f4ff,#eff9ff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}main{max-width:930px;margin:auto;padding:28px 18px 65px}h1{font-size:clamp(30px,5vw,48px);margin:8px 0}p{line-height:1.55}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.tag{background:white;padding:8px 15px;border-radius:30px;color:var(--purple);font-weight:700}.sub{color:#64708a}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.nav button{background:white;color:#544c70;border:1px solid #e2d9fb}.nav button.active{background:var(--purple);color:white}button{border:0;border-radius:15px;padding:12px 17px;cursor:pointer;font:inherit;font-weight:650;transition:transform .15s}button:hover{transform:translateY(-2px)}button:focus-visible,input:focus-visible{outline:3px solid #c8b8ff}button.primary{background:var(--purple);color:white}button.secondary{background:#ece7ff;color:#51449c}.panel{background:#fff;border:1px solid #e9e3f7;border-radius:26px;padding:clamp(20px,4vw,34px);box-shadow:0 15px 45px #574b9410;min-height:340px}.small{font-size:14px;color:#78829a}.progress{height:10px;border-radius:20px;background:#eee9f7;overflow:hidden;margin:12px 0 22px}.bar{height:100%;background:linear-gradient(90deg,#b4a0ff,#71d6b3);transition:width .3s}.flash{width:100%;min-height:210px;border:2px dashed #cfc0fb;border-radius:23px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:22px;cursor:pointer}.word{font-size:clamp(30px,6vw,52px);font-weight:800;color:#4b3a98}.phon{font-size:20px;color:#7465a4;margin-top:8px}.translation{font-size:29px;font-weight:750;color:#385f6c}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{background:#f8f6ff;color:#34314d;border:2px solid transparent;min-height:66px;text-align:left}.choice.good{border-color:#55c88c;background:#e5faef}.choice.bad{border-color:#fa879c;background:#fff0f2}.feedback{min-height:28px;margin-top:15px;font-weight:700}.success{color:#218455}.error{color:#c34b66}.question{font-size:clamp(21px,3vw,28px);font-weight:700;margin:12px 0 22px}.field{width:100%;border:2px solid #ddd5f4;border-radius:14px;padding:14px;font:inherit;font-size:19px}.sentence{background:#f6f4ff;border-radius:15px;padding:20px;font-size:21px;line-height:1.7}.muted{color:#73809b}.footer{margin-top:22px;text-align:center;color:#7b8096;font-size:13px}.pill{display:inline-block;background:var(--mint);padding:7px 12px;border-radius:50px;font-size:13px;font-weight:700}.summary{text-align:center;padding:30px 0}.summary strong{font-size:54px;color:var(--purple)}@media(max-width:560px){.choices{grid-template-columns:1fr}.panel{min-height:380px}.nav button{flex:1 1 42%}}</style></head><body><main><div class="top"><div><div class="tag" style="display:inline-block">✨ English · A2</div><h1>Word Quest <span style="color:#a78af6">✦</span></h1><p class="sub">9 слов · 4 игры · учим, узнаём и используем в речи</p></div><div class="tag" id="score">⭐ 0 points</div></div><div class="nav"><button class="active" data-mode="cards">🃏 Карточки</button><button data-mode="quiz">🎯 Выбери перевод</button><button data-mode="write">✍️ Напиши слово</button><button data-mode="sentences">💬 В предложении</button></div><section class="panel" id="app" aria-live="polite"></section><div class="footer">Нажимай на карточки, отвечай на вопросы и собирай звёзды 🌟</div></main><script>
const words=[{w:'couple',t:'пара',p:'/:',e:'They are a happy ___.',hint:'Они счастливая пара.'},{w:'awful',t:'ужасный',p:'/ˈɔːfəl/',e:'The weather is ___.',hint:'Погода ужасная.'},{w:'call',t:'звонить; звать',p:'/kɔːl/',e:'Please ___ me after school.',hint:'Пожалуйста, позвони мне после школы.'},{w:'say',t:'говорить; сказать',p:'/seɪ/',e:'What do you want to ___?',hint:'Что ты хочешь сказать?'},{w:'wait',t:'ждать',p:'/weɪt/',e:'Please ___ for me!',hint:'Пожалуйста, подожди меня!'},{w:'waiter',t:'официант',p:'/ˈweɪtər/',e:'The ___ brings our food.',hint:'Официант приносит нашу еду.'},{w:'although',t:'хотя',p:'/ɔːlˈðəʊ/',e:'___ it is cold, we go outside.',hint:'Хотя холодно, мы выходим на улицу.'},{w:'each other',t:'друг друга',p:'/ˌiːtʃ ˈʌðər/',e:'They help ___ ___.',hint:'Они помогают друг другу.'},{w:'mad',t:'безумный; злой',p:'/mæd/',e:'He is ___ because he lost his phone.',hint:'Он злится, потому что потерял телефон.'},{w:'hurry',t:'спешить; торопиться',p:'/ˈhʌri/',e:'We must ___ or we will be late!',hint:'Нам нужно поторопиться, иначе мы опоздаем!'}];
let mode='cards',index=0,flipped=false,points=0,locked=false,quiz=[],writing=[],sentences=[];const app=document.getElementById('app');const shuffle=a=>[...a].sort(()=>Math.random()-.5);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const add=n=>{points+=n;document.getElementById('score').textContent='⭐ '+points+' points'};function init(m){mode=m;index=0;flipped=false;locked=false;quiz=shuffle(words);writing=shuffle(words);sentences=shuffle(words);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));render()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>init(b.dataset.mode));function heading(name,len){return `<div class="small">${name} · ${Math.min(index+1,len)} / ${len}</div><div class="progress"><div class="bar" style="width:${Math.min(index/len*100,100)}%"></div></div>`}function done(name){app.innerHTML=`<div class="summary"><div style="font-size:55px">🏆</div><h2>${name} пройдена!</h2><p>Отличная работа! Можно повторить слова или перейти к следующей игре.</p><strong>⭐ ${points}</strong><div class="actions"><button class="primary" onclick="init('${mode}')">🔄 Играть ещё раз</button></div></div>`}function next(){index++;locked=false;flipped=false;render()}
function render(){if(mode==='cards'){if(index>=words.length)return done('Карточки');const x=words[index];app.innerHTML=heading('Узнай слова',words.length)+`<div class="flash" id="flip" role="button" tabindex="0"><div class="small">${flipped?'Перевод':'Английское слово'}</div><div class="${flipped?'translation':'word'}">${flipped?x.t:x.w}</div>${flipped?'':`<div class="phon">${x.p}</div>`}<p class="muted">Нажми, чтобы перевернуть ↻</p></div><div class="actions"><button class="secondary" id="back" ${index===0?'disabled':''}>← Назад</button><button class="primary" id="next">${index===words.length-1?'Готово ✓':'Следующее →'}</button></div>`;document.getElementById('flip').onclick=()=>{flipped=!flipped;render()};document.getElementById('flip').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flipped=!flipped;render()}};document.getElementById('back').onclick=()=>{index--;flipped=false;render()};document.getElementById('next').onclick=next;return}
if(mode==='quiz'){if(index>=quiz.length)return done('Викторина');let x=quiz[index],options=shuffle([x,...shuffle(words.filter(y=>y!==x)).slice(0,3)]);app.innerHTML=heading('Выбери правильный перевод',quiz.length)+`<div class="question">${x.w} <span class="small">${x.p}</span></div><div class="choices">${options.map(o=>`<button class="choice" data-answer="${o.w}">${o.t}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="actions"><button class="primary" id="next" hidden>Дальше →</button></div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const ok=b.dataset.answer===x.w;b.classList.add(ok?'good':'bad');document.querySelectorAll('[data-answer]').forEach(z=>{z.disabled=true;if(z.dataset.answer===x.w)z.classList.add('good')});document.getElementById('feedback').innerHTML=ok?'<span class="success">✓ Правильно! +10 ⭐</span>':`<span class="error">Правильный ответ: ${x.t}</span>`;if(ok)add(10);document.getElementById('next').hidden=false});document.getElementById('next').onclick=next;return}
if(mode==='write'){if(index>=writing.length)return done('Написание');let x=writing[index];app.innerHTML=heading('Вспомни написание',writing.length)+`<div class="small">Переведи на английский</div><div class="question">${x.t}</div><input class="field" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the English word..."><div id="feedback" class="feedback"></div><div class="actions"><button class="secondary" id="hint">💡 Подсказка</button><button class="primary" id="check">Проверить</button><button class="primary" id="next" hidden>Дальше →</button></div>`;let field=document.getElementById('answer');const check=()=>{if(locked)return;let ok=field.value.trim().toLowerCase().replace(/\s+/g,' ')===x.w;if(ok){locked=true;add(15);document.getElementById('feedback').innerHTML='<span class="success">✓ Отлично! +15 ⭐</span>';document.getElementById('check').hidden=true;document.getElementById('next').hidden=false;field.disabled=true}else document.getElementById('feedback').innerHTML='<span class="error">Попробуй ещё раз 💜</span>'};document.getElementById('check').onclick=check;field.onkeydown=e=>{if(e.key==='Enter'){if(locked)next();else check()}};document.getElementById('hint').onclick=()=>{document.getElementById('feedback').textContent=`Первая буква: ${x.w[0].toUpperCase()} · ${x.w.length} символов (включая пробелы)`};document.getElementById('next').onclick=next;field.focus();return}
if(mode==='sentences'){if(index>=sentences.length)return done('Предложения');let x=sentences[index];let opts=shuffle([x,...shuffle(words.filter(y=>y!==x)).slice(0,3)]);app.innerHTML=heading('Вставь слово в предложение',sentences.length)+`<div class="sentence">${x.e.replace(/___ ___|___/g,'<span style="color:#9373e7">______</span>')}</div><p class="small">${x.hint}</p><div class="choices">${opts.map(o=>`<button class="choice" data-answer="${o.w}">${o.w}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="primary" id="next" hidden>Следующее →</button></div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;let ok=b.dataset.answer===x.w;b.classList.add(ok?'good':'bad');document.querySelectorAll('[data-answer]').forEach(z=>{z.disabled=true;if(z.dataset.answer===x.w)z.classList.add('good')});document.getElementById('feedback').innerHTML=ok?'<span class="success">✓ Great! +10 ⭐</span>':`<span class="error">Правильно: ${x.w}</span>`;if(ok)add(10);document.getElementById('next').hidden=false});document.getElementById('next').onclick=next}}
init('cards');</script></body></html>
